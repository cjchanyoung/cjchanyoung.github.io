title: Charles
email: cjchanyoung@gmail.com
description: >-
  For fine games. Aspiring Game Engine Architect.
github_username: cjchanyoung
minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

author:
  name   : "Charles Jung"
  avatar : "/assets/images/Profile_Charles.jpg"
  bio    : "For fine games."
  links:
    - label: "Youtube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@cjchanyoung"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cjchanyoung"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/cjchanyoung"

footer:
  links:
    - label: "Youtube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@cjchanyoung"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cjchanyoung/"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/cjchanyoung/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true